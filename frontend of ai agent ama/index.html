<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryve — AI Chief of Staff</title>
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    
    <link rel="manifest" href="/manifest.json" />

    <meta name="application-name" content="Ryve" />
    <meta name="theme-color" content="#FF6B00" />
    <meta name="description"
      content="Ryve is your AI Chief of Staff. Manage tasks, calendar, email and your day intelligently." />

    <!-- Mobile web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ryve" />

    <!-- Apple touch icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ryve — AI Chief of Staff" />
    <meta property="og:description"
      content="Ryve is your AI Chief of Staff." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
